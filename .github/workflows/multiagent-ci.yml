# multiagent toolkit CI template. Installed per project by setup-github.sh as
# .github/workflows/multiagent-ci.yml. Job names "tests" and "secret-scan" are the required status
# checks of the default-branch ruleset. Actions and binaries are pinned by SHA.
name: multiagent-ci
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Project tests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && . "$RUNNER_TEMP/venv/bin/activate" && pip install --quiet pytest==8.4.2 && python -m pytest -q -p no:cacheprovider
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.0 (sha256 pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gl.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan outgoing commits (repository gitleaks config/ignores are NOT trusted)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          mkdir -p "$RUNNER_TEMP/noignore"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then RANGE="$HEAD_SHA"; else RANGE="$BASE..$HEAD_SHA"; fi
          git log -p --no-color --format='commit %H' "$RANGE" | (cd "$RUNNER_TEMP" && ./gitleaks stdin \
            --no-banner --redact --exit-code 1 -c gitleaks.toml --gitleaks-ignore-path noignore --ignore-gitleaks-allow)
